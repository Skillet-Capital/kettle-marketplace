# ====================================
#           Token Events
# ====================================

type Account @entity {
  id: Bytes!
  assets: [Asset!]! @derivedFrom(field: "owner")
}

type Asset @entity {
  id: String!
  collection: Bytes!
  identifier: BigInt!
  owner: Account!
}

type Balance @entity {
  id: Bytes!
  balance: BigInt!
}

type Transfer @entity {
  id: String!
  from: Bytes!
  to: Bytes!
  tokenId: BigInt!
  collection: Bytes!
  timestamp: BigInt!
}

# ====================================
#           Mystery Box Events
# ====================================

type MysteryBox @entity {
  id: Bytes!
  name: String!
  symbol: String!
  totalSupply: BigInt!
  price: BigInt!
  currency: Bytes!
  paymentRecipient: Bytes!
  privateMintOpenTime: BigInt!
  publicMintOpenTime: BigInt!
  totalMinted: BigInt!
}

type MysteryBoxAccount @entity {
  id: Bytes!
  assets: [MysteryBoxAsset!]! @derivedFrom(field: "owner")
}

type MysteryBoxAsset @entity {
  id: String!
  collection: Bytes!
  identifier: BigInt!
  owner: MysteryBoxAccount!
}

# ====================================
#           Token Events
# ====================================

type Activity @entity {
  id: Bytes!
  type: String!
  buyer: Bytes!
  seller: Bytes!
  collateralId: String!
  collection: Bytes!
  tokenId: BigInt!
  currency: Bytes!
  amount: BigInt!
  timestamp: BigInt!
  txn: Bytes!
}

type Redemption @entity {
  id: String!
  redemptionHash: Bytes!
  redeemer: Bytes!
  collection: Bytes!
  tokenId: BigInt!
  collateralId: String!
  currency: Bytes!
  amount: BigInt!
  timestamp: BigInt!
}

# ====================================
#           Admin Updates
# ====================================

type RedemptionSignerUpdate @entity {
  id: Bytes!
  address: Bytes!
  timestamp: BigInt!
}

type RedemptionWalletUpdate @entity {
  id: Bytes!
  address: Bytes!
  timestamp: BigInt!
}

type OfferManagerUpdate @entity {
  id: Bytes!
  address: Bytes!
  timestamp: BigInt!
}
